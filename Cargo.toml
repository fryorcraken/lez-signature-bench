[package]
name = "lez-signature-bench"
version = "0.1.0"
edition = "2024"
license = { workspace = true }

[workspace.package]
license = "MIT or Apache-2.0"

[workspace]
resolver = "3"
members = [
  ".",
  "methods",
  "methods/guest",
]

[workspace.lints.rust]
unsafe_code = "warn"

# Tight release profile. RISC0 guests page from the ELF, so smaller +
# better-optimized binaries reduce both cycle count and ELF footprint.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
# LEZ `dev` (the v0.4 actor model, PR #935). There is no `master`; `main`
# predates the actor model. Pinned by rev so the numbers are reproducible.
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "dcbd318f0f2ef601fc93e67e0dabc49895d811ef" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "dcbd318f0f2ef601fc93e67e0dabc49895d811ef" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "dcbd318f0f2ef601fc93e67e0dabc49895d811ef" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "dcbd318f0f2ef601fc93e67e0dabc49895d811ef" }

risc0-zkvm = { version = "3.1.0", features = ["std"] }
risc0-build = "3.0.7"
risc0-binfmt = "3.0.6"
borsh = { version = "1.5.7", features = ["derive"] }
anyhow = "1.0.98"

serde = { version = "1.0.228", features = ["derive"] }
hex = "0.4.3"
sha2 = { version = "0.10", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "schnorr", "std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
hbs-lms = { version = "0.2.0-alpha.1", default-features = false }
xmss = { version = "=0.1.0-pre.0", default-features = false }
tiny-keccak = { version = "2.0", features = ["keccak"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
# Mirrors LEZ `dev`'s own [patch.crates-io] (patches of a git dependency are
# not inherited, so the root workspace has to repeat them).
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[features]
default = ["e2e"]
# End-to-end private-TX mode (`bench --account-id`). Pulls in the LEZ wallet
# and its whole dependency tree; build with `--no-default-features` for the
# local-prove bench only.
e2e = ["dep:lee", "dep:wallet", "dep:program_loader_core", "dep:risc0-binfmt", "dep:anyhow"]

[dependencies]
lez_signature_bench_methods = { path = "methods" }
lee_core = { workspace = true, features = ["host"] }
lee = { workspace = true, optional = true }
wallet = { workspace = true, optional = true }
program_loader_core = { workspace = true, optional = true }
risc0-binfmt = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

risc0-zkvm.workspace = true
borsh.workspace = true
serde.workspace = true
hex.workspace = true
k256 = { workspace = true, features = ["arithmetic"] }
p256 = { workspace = true, features = ["arithmetic"] }
ed25519-dalek.workspace = true
hbs-lms.workspace = true
xmss.workspace = true
sha2.workspace = true
tiny-keccak.workspace = true
clap.workspace = true
tokio.workspace = true
bincode = "1.3"
serde_json.workspace = true

[dev-dependencies]
anyhow.workspace = true
